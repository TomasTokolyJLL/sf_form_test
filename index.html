<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intake form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background-color: rgb(90, 90, 90);">

    <div class="container mt-5 p-4 shadow rounded" style="max-width: 600px;background-color: rgb(50, 122, 70);">
      <h4 class="mb-4" style="color: black;">SF Case Intake Form</h4>
      
      <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00D400000009ovR" method="POST">

        <input type="hidden" name="orgid" value="00D400000009ovR">
        <input type="hidden" name="retURL" value="https://brg.lightning.force.com/">

        <label for="name" class="form-label">Contact Name</label>
        <input id="name" maxlength="80" name="name" type="text" class="form-control mb-3" required>

        <label for="subject" class="form-label">Subject</label>
        <input id="subject" maxlength="80" name="subject" type="text" class="form-control mb-3" required>

        <label for="description" class="form-label">Description</label>
        <textarea name="description" id="description" class="form-control mb-3" rows="4" placeholder="Please provide detailed description..."></textarea>

        <label for="priority" class="form-label">Priority</label>
        <select id="priority" name="priority" class="form-select mb-4">
          <option value="">--Select Priority--</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <input id="00N8Z000003fKBJ" name="00N8Z000003fKBJ" value="Filtering VALUE">

        <button type="submit" name="submit" class="btn btn-primary w-100">Submit Case</button>

      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
